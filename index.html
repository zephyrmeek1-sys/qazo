function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',7000)}
let AC=null;const audioCtx=()=>{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}return AC};
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{const c=audioCtx();if(c&&c.state==='suspended')c.resume()},{passive:true}));

function playTone(n){try{if(n==='adhan'){if(SOUND_URL){new Audio(SOUND_URL).play();return}n='soft'}const c=audioCtx();if(!c)return;if(c.state==='suspended')c.resume();
const N={soft:[[523,0,.6],[659,.28,.6],[784,.56,1]],bell:[[880,0,1.4],[1320,0,.9],[1760,.02,.5]],beep:[[1000,0,.18],[1000,.28,.18],[1000,.56,.18]]}[n]||[],t0=c.currentTime+.02;
N.forEach(([f,st,d])=>{const o=c.createOscillator(),g=c.createGain();o.type=n==='beep'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(n==='beep'?.12:.25,t0+st+.02);g.gain.exponentialRampToValueAtTime(.001,t0+st+d);o.connect(g);g.connect(c.destination);o.start(t0+st);o.stop(t0+st+d+.05)})}catch(e){}}
const playSound=()=>{const p=NP();if(p.snd)playTone(p.tone||'soft')};
function notify(ti,b,tag){toast(ti+(b?' · '+b:''));playSound();try{if(NP().snd&&navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}try{if(window.Notification&&Notification.permission==='granted')new Notification(ti,{body:b,tag:tag||ti})}catch(e){}}
async function setNotify(on){if(on){if(!window.Notification){alert(t('nn'));render();return}const p=await Notification.requestPermission();if(p!=='granted'){alert(t('nd'));render();return}}await pf('notify',on)}
const TZ='Asia/Tashkent',toMin=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
const nowTZ=()=>{const d=new Date();return{day:d.toLocaleDateString('en-CA',{timeZone:TZ}),min:toMin(d.toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}))}};
async function tick(){if(!sb||!S.pr||!S.pr.notify||nperm()!=='granted'||S.tk)return;S.tk=1;
try{const n=nowTZ(),p=NP(),tt=timesFor(n.day),city=cityName(S.pr.city);S.fired=S.fired||{};let st=null;
const due=(k,at)=>{const d=n.min-at;if(d>=0&&d<=3&&!S.fired[k]){S.fired[k]=1;return true}return false};
const load=async()=>{if(!st){const[a,b,c]=await Promise.all([sb.from('hayz_log').select('day').eq('day',n.day),sb.from('prayer_log').select('prayer').eq('day',n.day),sb.from('qazo_log').select('prayer').eq('day',n.day)]);st={hz:!!(a.data||[]).length,done:new Set((b.data||[]).map(x=>x.prayer)),q:(c.data||[]).length}}return st};

for(const[key,off,m]of[['b15',-15,15],['b10',-10,10],['time',0,0],['a15',15,15]]){if(!p[key]||!due(`${n.day}|${x}|${key}`,at+off))continue;const s=await load();if(s.hz)continue;
if(key=='a15'){if(!s.done.has(x))notify(`${nm}: ${t('n_a15t')}`,t('n_a15b'),n.day+x+key)}
else if(key=='time')notify(`${nm} ${t('ntime')}`,`${tt[x]} · ${city}`,n.day+x+key);
else notify(`${nm}: ${m} ${t('n_minleft')}`,`${t('n_at')} ${tt[x]} · ${city}`,n.day+x+key)}}
if(p.eve&&due(n.day+'|eve',toMin(p.evt))){const s=await load(),miss=P.slice(0,5).filter(x=>!s.done.has(x));notify(t('n_eveT'),(s.hz?t('hayzOn'):miss.length?`${t('n_miss')}: ${miss.map(x=>t(x)).join(', ')}`:t('n_allok'))+` · ${t('qazo')}: ${s.q}/${TGT()*6}`,n.day+'eve')}
}catch(e){}finally{S.tk=0}}

const adRows=()=>{const u=adFilter();return u.length?u.map(adUc).join(''):'<p class="mu" style="text-align:center">Hech narsa topilmadi</p>'};
function adUs(){return `<div class="card"><input id="aq" placeholder="Qidirish: ism yoki telefon" value="${esc(AD.q)}" oninput="AD.q=this.value;$('#ul').innerHTML=adRows()"><div class="chips">${[['all','Hammasi'],['male','Erkak'],['female','Ayol']].map(([k,n])=>chip(AD.g==k,`AD.g='${k}';adminRender()`,n)).join('')}</div><select onchange="AD.sort=this.value;$('#ul').innerHTML=adRows()">${[['new','Yangilari'],['act','Oxirgi faol'],['most','Qazo ko‘p'],['least','Qazo kam']].map(([k,n])=>`<option value="${k}" ${AD.sort==k?'selected':''}>${n}</option>`).join('')}</select><div class="mu sm">${AD.users.length} ta foydalanuvchi</div></div><div id="ul">${adRows()}</div>`}
function adRq(){if(!AD.reqs.length)return `<div class="card mu" style="text-align:center">So‘rovlar yo‘q</div>`;return AD.reqs.map(r=>{const u=AD.users.find(x=>x.phone==r.phone),nw=r.status=='new';return `<div class="card"><div class="top"><b>${esc(r.name)}</b><span class="badge ${nw?'':'ok'}">${nw?'Yangi':'Bajarildi'}</span></div><div class="mu sm">+${esc(r.phone)} · ${dt(r.created_at)}</div><p style="margin:8px 0"><b>${RLB[r.reason]||''}</b>${r.message?`<br>${esc(r.message)}`:''}</p><div class="chips">${u&&r.reason=='password'?`<button class="chip on" onclick="adPass('${u.user_id}')">Parolni tiklash</button>`:''}<button class="chip" onclick="adReq(${r.id},'${nw?'done':'new'}')">${nw?'Bajarildi':'Qayta ochish'}</button></div>${!u&&r.reason=='password'?'<div class="mu sm">Bu raqam bilan foydalanuvchi topilmadi</div>':''}</div>`}).join('')}
function adAc(){return `<div class="card sc"><table>${AD.act.filter(x=>x.action!='hayz').map(x=>`<tr><td>${dt(x.created_at)}</td><td>+${esc(x.phone)}</td><td>${esc(ACL[x.action]||x.action)}</td><td>${esc(x.detail&&x.detail.prayer?t(x.detail.prayer):'')} ${esc(x.detail&&x.detail.day||'')}${x.detail&&x.detail.count!=null?' ×'+x.detail.count:''}</td></tr>`).join('')||'<tr><td class="mu">Hozircha faoliyat yo‘q</td></tr>'}</table></div>`}
async function adDetail(id){const{data,error}=await sb.rpc('admin_user_detail',{p_user:id});if(error)return alert(error.message);const p=data.profile||{},b=data.bal||{};
openSheet(`<div class="top"><h2 style="margin:0">${esc(p.name||'—')}</h2><button class="wd" onclick="supClose()">✕</button></div><p class="mu sm">+${esc(data.phone||'')} · ${p.gender=='female'?'Ayol':'Erkak'} · ${esc(p.city||'')} · reja ${p.daily_target||1}/kun<br>Ro‘yxat: ${dt(p.created_at)} · Hisob boshlanishi: ${esc(p.start_date||'—')}</p><div class="grid" style="grid-template-columns:repeat(2,1fr)">${P.map(x=>{const v=b[x]||{initial:0,done:0};return `<div class="card mini"><span class="mu sm">${t(x)}</span><b class="big">${(v.initial-v.done).toLocaleString()}</b><span class="mu sm">o‘qilgan ${v.done}</span></div>`}).join('')}</div><h3 style="margin:14px 0 6px;font-size:.95rem">Oxirgi amallar</h3><div class="sc"><table>${(data.recent||[]).filter(x=>x.action!='hayz').map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(ACL[x.action]||x.action)}</td><td>${esc(x.detail&&x.detail.prayer?t(x.detail.prayer):'')} ${esc(x.detail&&x.detail.day||'')}</td></tr>`).join('')||'<tr><td class="mu">—</td></tr>'}</table></div><div class="chips"><button onclick="supClose();adPass('${id}')">Parol o‘zgartirish</button></div>`)}
async function adPass(id){const np=prompt('Yangi parol (kamida 6 belgi):',Math.random().toString(36).slice(2,10));if(!np)return;const{error}=await sb.rpc('admin_reset_password',{p_user:id,p_pass:np});alert(error?error.message:'Parol o‘zgartirildi: '+np+'\nUni foydalanuvchiga yuboring.')}
async function adDel(id){if(!confirm('Foydalanuvchi va uning barcha ma’lumotlari o‘chiriladi. Qaytarib bo‘lmaydi. Davom etasizmi?'))return;const{error}=await sb.rpc('admin_delete_user',{p_user:id});if(error)alert(error.message);adminList()}
async function adReq(id,st){await sb.rpc('admin_set_request',{p_id:id,p_status:st});adminList()}

// ===== PWA, effektlar, ishga tushirish =====
try{const ic="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f9d6e'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EQ%3C/text%3E%3C/svg%3E";const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify({name:'Qazo',short_name:'Qazo',start_url:location.pathname,display:'standalone',background_color:'#f6eedc',theme_color:'#1f8a5f',icons:[{src:ic,sizes:'512x512',type:'image/svg+xml'}]})],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
if(matchMedia('(hover:hover)').matches){const g=$('#glow');addEventListener('pointermove',e=>{g.style.transform=`translate(${e.clientX-210}px,${e.clientY-210}px)`})}
addEventListener('hashchange',()=>{ANIM=true;boot()});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);boot();
</script></body></html>
