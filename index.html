.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:2px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}

.dn{display:flex;gap:8px;align-items:center}.dn button{width:46px;padding:11px 0;flex:none}.dn input{margin:0}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--mu)}.bars i{width:100%;background:linear-gradient(var(--gold),var(--ac));border-radius:8px 8px 3px 3px;min-height:4px;transition:height .5s}
.who{display:flex;gap:14px;align-items:center}.av{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--ac);color:var(--onac);font:700 1.5rem Georgia,serif}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:8px 6px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.in>*{animation:up .5s both}.in>:nth-child(2){animation-delay:.06s}.in>:nth-child(3){animation-delay:.12s}.in>:nth-child(4){animation-delay:.18s}.in>:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media(min-width:700px){main{padding:30px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cd{padding:8px 0;border-radius:12px;border:0;background:none;font-size:.9rem}.cd.on{background:var(--ac);color:var(--onac);font-weight:700}.cd.td{box-shadow:inset 0 0 0 2px var(--gold)}.cd:disabled{opacity:.3}
.datebtn{width:100%;text-align:left;margin:0 0 6px;display:flex;justify-content:space-between}.dn .datebtn{flex:1;width:auto;min-width:0;margin:0;padding:12px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd{width:auto!important;padding:11px 16px!important}.cf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ac2);border-radius:14px;padding:10px 12px;margin:8px 0}
.avw{position:relative;cursor:pointer;flex:none}.av{overflow:hidden;object-fit:cover}.avb{position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#2a1c00;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.75rem}
#toast{position:fixed;z-index:9;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:12px 18px;box-shadow:var(--sh);transition:transform .4s cubic-bezier(.3,1.4,.5,1);max-width:90vw;font-weight:600}#toast.on{transform:translate(-50%,0)}
.warn{background:color-mix(in srgb,var(--gold) 18%,transparent);border-radius:14px;padding:10px 12px;font-size:.88rem;margin:8px 0}

<script>
// ====== SOZLAMA: Supabase > Project Settings > API dan oling (faqat anon kalit!) ======
const SB_URL='YOUR_SUPABASE_URL', SB_KEY='YOUR_SUPABASE_ANON_KEY';
let sb=null,CFG_ERR='';
let DEMO=false;
try{if(!/^https?:\/\//.test(SB_URL)||SB_KEY.indexOf('YOUR')===0){DEMO=true;sb=mockSB()}else{if(typeof supabase==='undefined')throw new Error('Supabase kutubxonasi yuklanmadi (internet/CDN tekshiring)');sb=supabase.createClient(SB_URL,SB_KEY)}}catch(e){CFG_ERR=e.message}
function mockSB(){
 let db;try{db=JSON.parse(localStorage.qdemo)}catch(e){}
 db=db||{users:[],sess:null,profiles:[],bal:[],pl:[],ql:[],hl:[],al:[]};
 const save=()=>{try{localStorage.qdemo=JSON.stringify(db)}catch(e){}};
 const me=()=>db.sess,T={profiles:'profiles',qazo_balance:'bal',prayer_log:'pl',qazo_log:'ql',hayz_log:'hl',audit_log:'al'};
 const mine=t=>db[t].filter(r=>r.user_id===me());
 const D=s=>new Date(s+'T00:00:00Z'),iso=d=>d.toISOString().slice(0,10),add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
 const addY=(s,n)=>{const d=D(s),m=d.getUTCMonth(),dd=d.getUTCDate(),r=new Date(Date.UTC(d.getUTCFullYear()+n,m,1)),last=new Date(Date.UTC(r.getUTCFullYear(),m+1,0)).getUTCDate();r.setUTCDate(Math.min(dd,last));return iso(r)};
 const log=(a,d)=>{db.al.unshift({user_id:me(),action:a,detail:d,created_at:new Date().toISOString()})};
 const rem=p=>{const b=mine('bal').find(x=>x.prayer===p);return b?b.initial-mine('ql').filter(x=>x.prayer===p).length:0};
 const E=m=>({data:null,error:{message:m}});
 function from(n){let f=[],ord=null,lim=0,upd=null,rg=null;
  const q={select(){return q},eq(k,v){f.push([k,v]);return q},order(c,o){ord=[c,!o||o.ascending!==false];return q},range(a,b){rg=[a,b];return q},limit(x){lim=x;return q},update(v){upd=v;return q},
   maybeSingle(){return run().then(r=>({data:r.data[0]||null}))},then(a,b){return run().then(a,b)}};
  async function run(){let r=mine(T[n]).filter(x=>f.every(([k,v])=>k==='user_id'||x[k]===v));
   if(upd){r.forEach(x=>Object.assign(x,upd));save();return{data:null}}
   if(ord){const[c,asc]=ord;r=r.slice().sort((a,b)=>(a[c]<b[c]?-1:a[c]>b[c]?1:0)*(asc?1:-1))}if(rg)r=r.slice(rg[0],rg[1]+1);if(lim)r=r.slice(0,lim);return{data:r}}
  return q}
 async function rpc(fn,a){const id=me();
  if(fn==='admin_users'||fn==='admin_reset_password'||fn==='admin_delete_user'){
   if(id!=='admin')return E('not admin');
   if(fn==='admin_users')return{data:db.users.map(u=>{const p=db.profiles.find(x=>x.user_id===u.id)||{};return{user_id:u.id,phone:u.email.split('@')[0],name:p.name,gender:p.gender,created_at:u.created,last_sign_in:u.last,remaining:db.bal.filter(x=>x.user_id===u.id).reduce((s,x)=>s+x.initial,0)-db.ql.filter(x=>x.user_id===u.id).length}}),error:null};
   if(fn==='admin_reset_password'){if((a.p_pass||'').length<6)return E('short');const u=db.users.find(x=>x.id===a.p_user);if(u)u.password=a.p_pass;save();return{error:null}}
   ['profiles','bal','pl','ql','hl','al'].forEach(t=>db[t]=db[t].filter(x=>x.user_id!==a.p_user));db.users=db.users.filter(x=>x.id!==a.p_user);save();return{error:null}}
  if(!id||id==='admin')return E('auth');
  if(fn==='setup_profile'){
   const s=a.p_start||add(addY(a.p_birth,a.p_gender==='male'?12:9),1),e=add(a.p_prayer_from,-1),d=Math.max(Math.round((D(e)-D(s))/864e5)+1,0);let ex=0;
   if(a.p_gender==='female')ex=Math.min(d,Math.round(Math.max(d/30.4375-(a.p_preg_list||[]).reduce((s,x)=>s+x,0),0)*Math.min(Math.max(a.p_hayz||0,0),15))+(a.p_children||0)*Math.min(Math.max(a.p_nifas||0,0),60));
   const n=d-ex,old=db.profiles.find(x=>x.user_id===id)||{city:'Tashkent',asr_school:1,lang:'uz',theme:'auto',notify:false};
   db.profiles=db.profiles.filter(x=>x.user_id!==id);
   db.profiles.push({...old,user_id:id,phone:db.users.find(u=>u.id===id).email.split('@')[0],name:a.p_name||null,gender:a.p_gender,birth_date:a.p_birth,prayer_from:a.p_prayer_from,start_date:s,married:!!a.p_married,hayz_days:a.p_hayz,children:a.p_children,nifas_days:a.p_nifas,preg_months:(a.p_preg_list||[]).reduce((s,x)=>s+x,0),pregnancies:a.p_preg_list||[]});
   db.bal=db.bal.filter(x=>x.user_id!==id);P.forEach(p=>db.bal.push({user_id:id,prayer:p,initial:n}));
   const r={start:s,end:e,days:d,excluded:ex,per_prayer:n};log('setup',r);save();return{data:r,error:null}}
  if(fn==='toggle_item'){const{p_kind:k,p_prayer:p,p_day:day,p_on:on}=a;if(day>add(tod(),1))return E('future');
   const L=k==='qazo'?'ql':k==='prayer'?'pl':'hl',has=db[L].some(x=>x.user_id===id&&x.day===day&&(k==='hayz'||x.prayer===p));
   if(on){if(k==='qazo'&&rem(p)<=0&&!has)return E('empty');if(!has)db[L].push(k==='hayz'?{user_id:id,day}:{user_id:id,day,prayer:p,created_at:new Date().toISOString()});if(k==='hayz')db.pl=db.pl.filter(x=>!(x.user_id===id&&x.day===day))}
   else db[L]=db[L].filter(x=>!(x.user_id===id&&x.day===day&&(k==='hayz'||x.prayer===p)));
   log(k,{prayer:p,day,on});save();return{data:null,error:null}}
  if(fn==='qazo_stats'){const bal={};P.forEach(p=>{const b=mine('bal').find(x=>x.prayer===p);if(b)bal[p]={initial:b.initial,done:mine('ql').filter(x=>x.prayer===p).length}});
   const t0=tod();return{data:{bal,last30:mine('ql').filter(x=>x.day>add(t0,-30)).length,week:[0,1,2,3,4,5,6].map(i=>{const d=add(t0,i-(D(t0).getUTCDay()+6)%7);return{day:d,qazo:mine('ql').filter(x=>x.day===d).length,prayer:mine('pl').filter(x=>x.day===d).length}})},error:null}}
  return E('unknown')}
 const auth={async getSession(){return{data:{session:db.sess?{user:{id:db.sess}}:null}}},
  async signUp({email,password}){if(db.users.find(u=>u.email===email))return{error:{message:'Bu raqam band'}};const id='u'+Date.now();db.users.push({id,email,password,created:new Date().toISOString(),last:null});db.sess=id;save();return{data:{session:{user:{id}}},error:null}},
  async signInWithPassword({email,password}){if(email==='admin@demo'&&password==='admin123'){db.sess='admin';save();return{error:null}}const u=db.users.find(x=>x.email===email&&x.password===password);if(!u)return{error:{message:'Telefon yoki parol xato'}};u.last=new Date().toISOString();db.sess=u.id;save();return{error:null}},
  async signOut(){db.sess=null;save()}};
 const storage={from:()=>({async upload(p,b){const u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});db.av=db.av||{};db.av[p]=u;save();return{error:null}},getPublicUrl:p=>({data:{publicUrl:(db.av||{})[p]||''}})})};
 return{from,rpc,auth,storage}}

async function adminLogin(){const{error}=await sb.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});if(error)return adminView(error.message);adminList()}
async function adminList(){const{data,error}=await sb.rpc('admin_users');if(error){await sb.auth.signOut();return adminView('Ruxsat yo‘q')}
show(`<div class="card"><div class="top"><h1>${t('admin')}</h1><button onclick="sb.auth.signOut().then(()=>adminView())">${t('out')}</button></div><p class="mu sm">${data.length} ta foydalanuvchi. Parollar hash ko‘rinishida saqlanadi va ko‘rsatilmaydi.</p><div class="sc"><table><tr><th>${t('phone')}</th><th>${t('name')}</th><th>Jins</th><th>Qazo</th><th>Ro‘yxat</th><th>Oxirgi kirish</th><th></th></tr>${data.map(u=>`<tr><td>${esc(u.phone)}</td><td>${esc(u.name)}</td><td>${esc(u.gender)}</td><td>${u.remaining}</td><td>${esc((u.created_at||'').slice(0,10))}</td><td>${esc((u.last_sign_in||'').slice(0,10))}</td><td><button onclick="adminPass('${u.user_id}')">${t('reset')}</button> <button class="d" onclick="adminDel('${u.user_id}')">${t('del')}</button></td></tr>`).join('')}</table></div></div>`)}
async function adminPass(id){const p=prompt(t('nop'));if(!p)return;const{error}=await sb.rpc('admin_reset_password',{p_user:id,p_pass:p});alert(error?error.message:'OK')}
async function adminDel(id){if(!confirm('O‘chirilsinmi? Qaytarib bo‘lmaydi.'))return;await sb.rpc('admin_delete_user',{p_user:id});adminList()}

if(matchMedia('(hover:hover)').matches){const g=$('#glow');addEventListener('pointermove',e=>{g.style.transform=`translate(${e.clientX-210}px,${e.clientY-210}px)`})}
addEventListener('hashchange',()=>{ANIM=true;boot()});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);boot();
